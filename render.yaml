services:
  - type: web
    name: beyachad
    runtime: static
    buildCommand: npm ci && node --import tsx scripts/check-config.mjs --production && npm run export:web
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.15.0
      - key: EXPO_PUBLIC_APP_ENV
        value: production
      - key: EXPO_PUBLIC_DEV_SESSION
        value: "false"
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /index.html
        name: Cache-Control
        value: no-cache
